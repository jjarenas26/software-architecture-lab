name: Pipes and Filters Tests

on:
  push:
    branches: [main]
    paths:
      - "01-architecture-styles/05-pipes-and-filters/**"
      - ".github/workflows/pipes-and-filters-tests.yml"
  pull_request:
    paths:
      - "01-architecture-styles/05-pipes-and-filters/**"
      - ".github/workflows/pipes-and-filters-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 01-architecture-styles/05-pipes-and-filters

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 01-architecture-styles/05-pipes-and-filters/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q
